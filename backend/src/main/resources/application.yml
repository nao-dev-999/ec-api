spring:
  # SIGTERM後、処理中のリクエストを完了させてから終了するための猶予秒数。
  # ECSタスク定義のstopTimeout(30秒)より短くし、SIGKILLで強制終了される前に
  # 確実にグレースフル完了させる。
  lifecycle:
    timeout-per-shutdown-phase: 25s

  datasource:
    url: jdbc:postgresql://localhost:5432/ec_db

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Tokyo
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # 実際にバインドされるのはこの spring.data.redis 配下(spring.redis.*はBoot3で廃止済み)。
  # ローカル/CIの素のRedisコンテナはAUTH・TLS未設定のため、password空・ssl無効をデフォルトにする。
  # ECSデプロイ先ではTerraform側でSPRING_DATA_REDIS_PASSWORD(Secrets Manager経由)・
  # SPRING_DATA_REDIS_SSL_ENABLED=trueを設定する(ecs/main.tf参照)。
  data:
    redis:
      host: localhost
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
  session:
    store-type: redis
    timeout: 1800s

  messages:
    basename: messages
    encoding: UTF-8

# Swagger UI / OpenAPI定義の公開有無。
# ローカル開発ではデフォルトで有効。ECSにデプロイされる環境ではTerraform側で
# APP_SWAGGER_ENABLED=false を設定し、API仕様が外部から閲覧できないようにする。
springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:true}

server:
  port: 8080
  # SIGTERM受信後、処理中のリクエストを完了させてから終了する(デフォルトはimmediateで即終了)。
  # ALBのderegistration_delay・ECSのstopTimeoutの猶予を活かすために必須。
  shutdown: graceful
  # ALBのidle_timeout(60秒)より長く設定すること。
  # 同じ/短いと、ALBが接続を再利用しようとした直後にTomcatが先に閉じてしまい、
  # 502 Bad Gatewayが断続的に発生する。未設定時のTomcatデフォルトはconnectionTimeoutと
  # 同じ60秒でALBと同値になり危険なため明示する。
  tomcat:
    keep-alive-timeout: 65s
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        secure: true
        same-site: Lax
